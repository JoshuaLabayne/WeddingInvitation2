<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- =========================
         LIGHT / DARK MODE FAVICON
    ========================== -->

    <!-- Favicon for light mode -->
    <link
      rel="icon"
      type="image/png"
      href="/light-icon.png"
      media="(prefers-color-scheme: light)"
    />

    <!-- Favicon for dark mode -->
    <link
      rel="icon"
      type="image/png"
      href="/dark-icon.png"
      media="(prefers-color-scheme: dark)"
    />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title>
      We’re getting married! #Jayel&amp;Aimee
    </title>

    <meta

      content="We’re getting married! View the wedding invitation of Jay-el and Aimee."
    />

    ========================== -->

    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:title"
      content="We’re getting married! #Jayel&amp;Aimee"
    />

    <meta

      content="Tap to view our wedding invitation."

      property="og:url"
      content="https://kasalnanijayelataimee.site/"

    <meta
      property="og:site_name"

    />

    <meta
      property="og:image"

    <meta
      property="og:image:secure_url"
      content="https://kasalnanijayelataimee.site/wedding-preview.png?v=3"
    />

    <meta
      property="og:image:type"
      content="image/png"
    />

    <meta
      property="og:image:width"

    <meta
      property="og:image:height"

      property="og:image:alt"

         TWITTER / OTHER PREVIEWS
    ========================== -->

      name="twitter:title"

    />
