<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 100 100"
>
  <style>
    /*
      Light browser tab:
      Use a dark icon
    */
    .icon {
      fill: #202124;
    }

    /*
      Dark browser tab:
      Use a light icon
    */
